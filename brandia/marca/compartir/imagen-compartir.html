<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- Fuente de apps/web/public/compartir.png (1200 × 630). Usa el logo oficial de ../logo, sin copiarlo.
     Para regenerarla, desde esta carpeta:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=../../../apps/web/public/compartir.png "file://$PWD/imagen-compartir.html" -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#1E1E1C;--n:#FF5C1A;--c:#C9C6BE;--h:#EDECE8;--p:#5C5A54}
body{margin:0}.lbl{display:none!important}.og:not(#C){display:none!important}
.lbl{font:600 22px 'Instrument Sans';margin:28px 0 10px;color:var(--g)}
.og{width:1200px;height:630px;position:relative;overflow:hidden;box-sizing:border-box}
.url{font:500 26px 'Instrument Sans';letter-spacing:.02em}
/* A */
.a{background:var(--g);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.a img{width:760px}
.a p{margin:0;color:var(--h);font:400 40px 'Fraunces';}
.a .url{position:absolute;bottom:44px;color:var(--c)}
.a .url b{color:var(--n);font-weight:500}
/* B */
.b{background:var(--h);padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.b img{width:330px}
.b h1{margin:0;color:var(--g);font:400 92px/1.02 'Fraunces';letter-spacing:-.02em;max-width:980px}
.b h1 i{color:#B23B0A}
.b .url{color:var(--p)}
/* C */
.c{background:var(--h);display:grid;grid-template-columns:470px 1fr}
.c .izq{background:var(--g);display:flex;align-items:center;justify-content:center}
.c .izq .iso{height:330px}
.c .der{padding:0 70px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.c .der img{width:520px}
.c .der p{margin:0;font:400 54px/1.1 'Fraunces';letter-spacing:-.01em;color:var(--g)}.c .der p i{color:#B23B0A}
.c .url{color:var(--p)}
</style></head><body>
<div class="lbl">A · Logo protagonista, fondo grafito</div>
<div class="og a" id="A"><img src="logo-horizontal-sobre-grafito.svg"><p>Tu marca, armada con IA.</p><div class="url">app.<b>brandiamos</b>.com</div></div>
<div class="lbl">B · Frase de la portada, fondo hueso</div>
<div class="og b" id="B"><img src="logo-horizontal.svg"><h1>Que se vea tan bien como <i>lo que hacés.</i></h1><div class="url">app.brandiamos.com · Tu marca, armada con IA</div></div>
<div class="lbl">C · Isotipo grande + logotipo</div>
<div class="og c" id="C"><div class="izq"><!-- las dos piezas de ../logo/isotipo-C-b-modular.svg, tal cual, en naranja --><svg class="iso" viewBox="0 0 62 76"><g transform="translate(-10,-12)" fill="#FF5C1A"><path d="M10,12 H38.5 A17.5,17.5 0 0 1 38.5,47 H36 V59 H20 V47 H10 Z"/><path d="M10,53 H18 V61 H38 V53 H54.5 A17.5,17.5 0 0 1 54.5,88 H10 Z"/></g></svg></div><div class="der"><img src="../logo/logotipo.svg"><p class="frase">Que se vea tan bien como <i>lo que hacés.</i></p><div class="url">app.brandiamos.com</div></div></div>
</body></html>
